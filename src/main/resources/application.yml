spring:
  application:
    name: safecrop-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    ignore-migration-patterns: []
    create-schemas: false

safecrop:
  login-protection:
    max-concurrent: 2
    global-tokens-per-minute: 60
    global-burst: 2
  jwt:
    issuer: safecrop-api
    audience: safecrop-web
    ttl-seconds: 900

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# These Hibernate emitters include JDBC messages/SQL or full causes before application handling.
# UnexpectedFailureDiagnostics records safe code metadata for request failures instead.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.event.internal.DefaultLoadEventListener: "OFF"
